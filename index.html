<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Tua Empresa - Apresentação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            background-color: #eaeaea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666;
            overflow: hidden;
        }
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 5px;
        }
        .title {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        .bio {
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #0066cc;
            color: white;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0052a3;
        }
        .btn-secondary {
            background-color: #f0f2f5;
            color: #333;
        }
        .btn-secondary:hover {
            background-color: #e4e6eb;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Substitui o texto abaixo pela imagem do teu logótipo se preferires <img src="logo.png" alt="Logo"> -->
        <div class="logo">
            LOGÓTIPO
        </div>
        
        <h1>Nome da Empresa</h1>
        <div class="title">O teu Nome • Cargo / Especialidade</div>
        
        <p class="bio">
            Ajudamos empresas e profissionais a destacarem-se através de soluções inovadoras e eficientes.
        </p>

        <div class="btn-group">
            <!-- Botão para guardar contacto diretamente no telemóvel -->
            <a href="contacto.vcf" class="btn">
                💾 Guardar Contacto (vCard)
            </a>
            
            <!-- Botão para ligar ou abrir WhatsApp -->
            <a href="https://wa.me/351912345678" class="btn" style="background-color: #25D366;">
                💬 Falar por WhatsApp
            </a>
            
            <!-- Botão para o Website -->
            <a href="https://www.tuaempresa.com" class="btn btn-secondary">
                🌐 Visitar Website
            </a>

            <!-- Botão para o LinkedIn ou outra rede -->
            <a href="https://linkedin.com/in/teuperfil" class="btn btn-secondary">
                💼 LinkedIn
            </a>
        </div>

        <div class="footer">
            Powered by NFC Card
        </div>
    </div>

</body>
</html>
