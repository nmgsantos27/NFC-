<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem-vindo | A Minha Empresa</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0a3d62 0%, #1e6091 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn {
    from { opacity:0; transform: translateY(15px); }
    to { opacity:1; transform: translateY(0); }
  }
  .logo {
    width: 90px; height: 90px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 20px;
    display: block;
    border: 3px solid #0a3d62;
  }
  h1 {
    color: #0a3d62;
    font-size: 1.6rem;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #555;
    font-size: 1rem;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    background: #0a3d62;
    color: #fff;
    border-radius: 12px;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    transition: transform 0.15s, background 0.2s;
    margin-bottom: 12px;
  }
  .btn:hover { background: #1e6091; transform: translateY(-2px); }
  .btn:active { transform: scale(0.98); }
  .btn.secondary {
    background: #fff;
    color: #0a3d62;
    border: 2px solid #0a3d62;
  }
  .btn.secondary:hover { background: #f0f6fb; }
  .footer {
    margin-top: 24px;
    font-size: 0.8rem;
    color: #999;
  }
</style>
</head>
<body>
  <div class="card">
    <!-- Substitui por o teu logótipo -->
    <img src="logo.png" alt="Logótipo" class="logo">

    <h1>Bem-vindo!</h1>
    <p class="subtitle">
      Obrigado por nos visitar.<br>
      Guarde o nosso contacto com um toque.
    </p>

    <!-- Botão vCard -->
    <a class="btn" href="contacto.vcf" download="contacto.vcf">
      📇 Guardar contacto
    </a>

    <!-- Botões opcionais -->
    <a class="btn secondary" href="tel:+351912345678">
      📞 Ligar agora
    </a>
    <a class="btn secondary" href="https://wa.me/351912345678">
      💬 WhatsApp
    </a>

    <p class="footer">© 2026 A Minha Empresa</p>
  </div>
</body>
</html>
